<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WonderCode Sandbox</title><meta name="theme-color" content="#0a192f">
<meta name="description" content="Offline SCADA script sandbox for InTouch QuickScript, ArchestrA C# and Historian SQL.">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="WonderCode">
<meta property="og:title" content="WonderCode Sandbox"><meta property="og:image" content="icons/og-image.svg">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.svg"><link rel="stylesheet" href="style.css"></head>
<body><header><button id="menuL" class="ic" aria-label="Templates">☰</button><b>WonderCode</b><span class="sub">InTouch · ArchestrA C# · Historian SQL</span><span class="sp"></span>
<select id="lang" aria-label="Language"><option value="qs">QuickScript</option><option value="cs">C#</option><option value="sql">SQL</option></select>
<div id="acts"><button id="new">New tab</button><select id="exp" aria-label="Export"><option value="">Export ▾</option><option value="json">Full backup (.json)</option><option value="script">This tab (.scp)</option></select><button id="plcBtn">PLC export</button><label class="btn">Import<input id="imp" type="file" hidden accept=".json,.script,.txt"></label></div>
<button id="more" class="ic" aria-label="More actions" aria-expanded="false">⋯</button><button id="menuR" class="ic" aria-label="Validator and tags">✓</button></header>
<dialog id="langDlg"><p id="langMsg"></p><div class="col"><button id="lcv">Auto-convert syntax &amp; tags</button><button id="ltp">Load a starter template (new tab)</button><button id="lkeep">Keep text, switch validator rules</button><button id="lcancel">Cancel</button></div></dialog>
<dialog id="welcome"><h2 id="wT"></h2><p id="wB"></p><div class="row"><button id="wPrev">Back</button><button id="wNext">Next</button><button id="wSkip">Skip</button></div></dialog>
<div id="toast" role="status" hidden></div><div id="scrim"></div>
<main><aside id="L"><button id="tour">? Help / Guided tour</button><h3>AGAC templates</h3><div id="tpl"></div></aside>
<section><div id="tabs"></div><div class="ed"><div id="gutter" aria-hidden="true"></div><pre id="hl" aria-hidden="true"></pre><textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Script editor"></textarea></div>
<div class="bar"><button id="val">Validate</button><button id="run">Simulate</button><span id="badge" hidden></span><span id="status"></span></div></section>
<aside id="R"><h3>Validator</h3><ul id="issues"></ul><h3>Tags</h3><div class="row"><button id="toSP">→ System Platform</button><button id="toIT">→ InTouch</button></div><ul id="tags"></ul><h3>Simulator</h3><div id="sim"></div><div class="lh"><h3>Execution log</h3><button id="logClear">Clear</button></div><pre id="log"></pre></aside></main>
<dialog id="plcDlg"><div class="row"><select id="plcT" aria-label="Target"><option value="scl">Siemens SCL (TIA Portal)</option><option value="st">Rockwell Structured Text</option><option value="csv">Modbus map (CSV)</option></select><button id="plcCopy">Copy</button><button id="plcDl">Download</button><button id="plcX">Close</button></div><pre id="plcOut"></pre></dialog>
<script src="js/db.js"></script><script src="js/validator.js"></script><script src="js/templates.js"></script><script src="js/tag-converter.js"></script><script src="js/editor.js"></script><script src="app.js"></script><script src="sw-register.js"></script></body></html>
